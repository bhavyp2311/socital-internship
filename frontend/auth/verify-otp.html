<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify OTP — Municipal System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    .otp-inputs { display: flex; gap: 8px; justify-content: center; margin: 20px 0; }
    .otp-inputs input {
      width: 48px; height: 56px; text-align: center; font-size: 1.3rem;
      font-weight: 700; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
    }
    .otp-inputs input:focus { outline: none; border-color: var(--accent); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
    .shake { animation: shake 0.3s; }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M16 6h.01M12 6h.01M8 10h.01M16 10h.01M12 10h.01M8 14h.01M16 14h.01M12 14h.01"/></svg></div>
        <h1>Verify Email</h1>
        <p>Enter the 6-digit code sent to <strong id="otp-email"></strong></p>
      </div>
      <div class="otp-inputs" id="otp-inputs">
        <input type="text" maxlength="1" data-idx="0" autofocus />
        <input type="text" maxlength="1" data-idx="1" />
        <input type="text" maxlength="1" data-idx="2" />
        <input type="text" maxlength="1" data-idx="3" />
        <input type="text" maxlength="1" data-idx="4" />
        <input type="text" maxlength="1" data-idx="5" />
      </div>
      <button id="verify-btn" class="btn btn-primary" style="width:100%;justify-content:center">
        Verify
      </button>
      <div class="auth-footer" id="countdown-section">
        Resend OTP in <span id="countdown">60</span>s
      </div>
      <div class="auth-footer" id="resend-section" style="display:none">
        <a href="#" id="resend-btn">Resend OTP</a>
      </div>
    </div>
  </div>
  <div id="toast-container"></div>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script>
    const email = sessionStorage.getItem("otp_email");
    if (!email) window.location.href = "register.html";
    document.getElementById("otp-email").textContent = email;

    const inputs = document.querySelectorAll("#otp-inputs input");
    inputs.forEach((inp, i) => {
      inp.addEventListener("input", (e) => {
        if (e.target.value && i < 5) inputs[i + 1].focus();
      });
      inp.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !e.target.value && i > 0) inputs[i - 1].focus();
      });
      inp.addEventListener("paste", (e) => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData("text").trim();
        text.split("").forEach((ch, j) => { if (inputs[j]) inputs[j].value = ch; });
        if (text.length >= 6) inputs[5].focus();
      });
    });

    let seconds = 60;
    const timer = setInterval(() => {
      seconds--;
      document.getElementById("countdown").textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        document.getElementById("countdown-section").style.display = "none";
        document.getElementById("resend-section").style.display = "block";
      }
    }, 1000);

    document.getElementById("resend-btn")?.addEventListener("click", async (e) => {
      e.preventDefault();
      try {
        await API.auth.register({ full_name: "Resend", email, password: "resend" });
        toast("OTP resent!", "success");
        seconds = 60;
        document.getElementById("countdown-section").style.display = "block";
        document.getElementById("resend-section").style.display = "none";
        document.getElementById("countdown").textContent = "60";
        setInterval(() => {
          seconds--;
          document.getElementById("countdown").textContent = seconds;
          if (seconds <= 0) {
            document.getElementById("countdown-section").style.display = "none";
            document.getElementById("resend-section").style.display = "block";
          }
        }, 1000);
      } catch (err) { toast(err.message, "error"); }
    });

    document.getElementById("verify-btn").addEventListener("click", async () => {
      const otp = Array.from(inputs).map(i => i.value).join("");
      if (otp.length !== 6) return toast("Enter all 6 digits", "error");
      const btn = document.getElementById("verify-btn");
      setLoading(btn, true);
      try {
        const data = await API.auth.verifyOtp({ email, otp });
        Auth.save(data, data.profile);
        toast("Email verified!", "success");
        setTimeout(() => Auth.redirectToDashboard(), 800);
      } catch (err) {
        toast(err.message, "error");
        document.getElementById("otp-inputs").classList.add("shake");
        setTimeout(() => document.getElementById("otp-inputs").classList.remove("shake"), 300);
        inputs.forEach(i => i.value = "");
        inputs[0].focus();
      } finally { setLoading(btn, false); }
    });
  </script>
</body>
</html>
