<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Complaint — Municipal Services</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div id="topnav"></div>
  <div style="padding:24px;max-width:700px;margin:0 auto">
    <h1 style="font-family:var(--font-display);font-size:var(--text-xl);margin-bottom:4px">Submit Complaint</h1>
    <p style="color:var(--text-muted);font-size:var(--text-sm);margin-bottom:20px">Report a civic issue in your area</p>
    <div class="steps">
      <div class="step active" id="step-1"><div class="step-num">1</div><div>Details</div></div>
      <div class="step" id="step-2"><div class="step-num">2</div><div>Location</div></div>
      <div class="step" id="step-3"><div class="step-num">3</div><div>Photos</div></div>
    </div>
    <!-- Step 1 -->
    <div class="card step-content" id="content-1">
      <div class="form-group"><label class="form-label">Title *</label><input type="text" id="title" class="form-input" placeholder="e.g. Pothole on Main Street" /></div>
      <div class="form-group"><label class="form-label">Description * <span style="font-weight:400;color:var(--text-muted)">(min 20 chars)</span></label><textarea id="description" class="form-input" rows="4" placeholder="Describe the issue in detail..." oninput="document.getElementById('char-count').textContent=this.value.length"></textarea><div style="font-size:var(--text-xs);color:var(--text-muted);text-align:right"><span id="char-count">0</span> characters</div></div>
      <div class="form-group">
        <label class="form-label">Priority</label>
        <div style="display:flex;gap:8px">
          <label style="display:flex;align-items:center;gap:4px;cursor:pointer;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:var(--text-sm)"><input type="radio" name="priority" value="low" /> Low</label>
          <label style="display:flex;align-items:center;gap:4px;cursor:pointer;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:var(--text-sm)"><input type="radio" name="priority" value="medium" checked /> Medium</label>
          <label style="display:flex;align-items:center;gap:4px;cursor:pointer;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:var(--text-sm)"><input type="radio" name="priority" value="high" /> High</label>
          <label style="display:flex;align-items:center;gap:4px;cursor:pointer;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:var(--text-sm)"><input type="radio" name="priority" value="critical" /> Critical</label>
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="goStep(2)">Next: Location</button>
    </div>
    <!-- Step 2 -->
    <div class="card step-content" id="content-2" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <label class="form-label" style="margin:0">Click on the map to set location</label>
        <button class="btn btn-sm btn-ghost" onclick="useMyLocation()">Use My Location</button>
      </div>
      <div class="map-container" id="map" style="margin-bottom:14px"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Latitude</label><input type="number" id="lat" class="form-input" step="any" placeholder="23.0225" /></div>
        <div class="form-group"><label class="form-label">Longitude</label><input type="number" id="lng" class="form-input" step="any" placeholder="72.5714" /></div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" style="flex:1" onclick="goStep(1)">Back</button>
        <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="goStep(3)">Next: Photos</button>
      </div>
    </div>
    <!-- Step 3 -->
    <div class="card step-content" id="content-3" style="display:none">
      <label class="form-label">Upload Photos (optional, max 3)</label>
      <div class="dropzone" id="dropzone" onclick="document.getElementById('file-input').click()">
        <input type="file" id="file-input" accept="image/*" multiple onchange="handleFiles(this.files)" />
        <p style="font-size:var(--text-sm)">Click to select or drop images here</p>
        <p style="font-size:var(--text-xs);color:var(--text-muted)">Max 5MB per image</p>
      </div>
      <div id="previews" style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"></div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-ghost" style="flex:1" onclick="goStep(2)">Back</button>
        <button class="btn btn-success" style="flex:1;justify-content:center" id="submit-btn" onclick="submitComplaint()">Submit Complaint</button>
      </div>
    </div>
  </div>
  <div id="toast-container"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/sidebar-citizen.js"></script>
  <script>
    Auth.require("citizen");
    renderTopnav("submit");
    Theme.apply();
    let map, marker, selectedFiles = [];
    function initMap() {
      map = L.map("map").setView([23.0225, 72.5714], 12);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "OpenStreetMap" }).addTo(map);
      map.on("click", (e) => {
        if (marker) map.removeLayer(marker);
        marker = L.marker(e.latlng).addTo(map);
        document.getElementById("lat").value = e.latlng.lat.toFixed(6);
        document.getElementById("lng").value = e.latlng.lng.toFixed(6);
      });
    }
    function useMyLocation() {
      if (!navigator.geolocation) return toast("Geolocation not supported", "error");
      navigator.geolocation.getCurrentPosition((pos) => {
        const { latitude: lat, longitude: lng } = pos.coords;
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map);
        map.setView([lat, lng], 15);
        document.getElementById("lat").value = lat.toFixed(6);
        document.getElementById("lng").value = lng.toFixed(6);
      }, () => toast("Could not get location", "error"));
    }
    function goStep(n) {
      document.querySelectorAll(".step-content").forEach(el => el.style.display = "none");
      document.getElementById(`content-${n}`).style.display = "block";
      document.querySelectorAll(".step").forEach((el, i) => {
        el.classList.remove("active", "done");
        if (i + 1 < n) el.classList.add("done");
        if (i + 1 === n) el.classList.add("active");
      });
      if (n === 2 && !map) setTimeout(initMap, 100);
    }
    function handleFiles(files) {
      for (const f of files) {
        if (selectedFiles.length >= 3) break;
        if (f.size > 5 * 1024 * 1024) { toast(`${f.name} exceeds 5MB`, "error"); continue; }
        selectedFiles.push(f);
      }
      renderPreviews();
    }
    function renderPreviews() {
      const el = document.getElementById("previews");
      el.innerHTML = "";
      selectedFiles.forEach((f, i) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const div = document.createElement("div");
          div.style.cssText = "position:relative";
          div.innerHTML = `<img src="${e.target.result}" style="height:80px;border-radius:var(--radius);border:1px solid var(--border)" /><button onclick="removeFile(${i})" style="position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:none;font-size:12px;cursor:pointer">${I.x}</button>`;
          el.appendChild(div);
        };
        reader.readAsDataURL(f);
      });
    }
    function removeFile(i) { selectedFiles.splice(i, 1); renderPreviews(); }

    async function submitComplaint() {
      const btn = document.getElementById("submit-btn");
      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();
      const priority = document.querySelector('input[name="priority"]:checked')?.value || "medium";
      if (!title) return toast("Title is required", "error");
      if (!description || description.length < 20) return toast("Description must be at least 20 characters", "error");
      setLoading(btn, true);
      try {
        const complaint = await API.citizen.submitComplaint({
          title, description, priority,
          latitude: parseFloat(document.getElementById("lat").value) || null,
          longitude: parseFloat(document.getElementById("lng").value) || null,
        });
        if (selectedFiles.length) {
          for (const f of selectedFiles) {
            const formData = new FormData();
            formData.append("image", f);
            try { await API.citizen.uploadImage(complaint.id, formData); } catch {}
          }
        }
        toast("Complaint submitted!", "success");
        setTimeout(() => window.location.href = "my-complaints.html", 1000);
      } catch (err) { toast(err.message, "error"); }
      finally { setLoading(btn, false); }
    }
  </script>
</body>
</html>
