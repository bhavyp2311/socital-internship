<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Area Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
<div class="app-layout">
  <div class="main">
    <header class="topbar">
      <button class="sidebar-toggle" onclick="openSidebar()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
      <span class="topbar-title">Dashboard</span>
      <span class="topbar-subtitle" id="ward-name"></span>
      <div class="topbar-right">
        <span id="topbar-date" style="font-size:var(--text-xs);color:var(--text-muted)"></span>
        <button class="theme-toggle" id="theme-toggle" onclick="Theme.toggle()"></button>
      </div>
    </header>
    <div class="page-content">
      <div class="stats-grid">
        <div class="stat-card stat-accent"><div class="stat-label">Total</div><div class="stat-value" id="stat-total">&mdash;</div></div>
        <div class="stat-card stat-warning"><div class="stat-label">Pending</div><div class="stat-value" id="stat-pending">&mdash;</div></div>
        <div class="stat-card" style="border-top:3px solid var(--info)"><div class="stat-label">In Progress</div><div class="stat-value" id="stat-inprogress">&mdash;</div></div>
        <div class="stat-card stat-success"><div class="stat-label">Completed</div><div class="stat-value" id="stat-completed">&mdash;</div></div>
      </div>
      <div class="stats-grid" style="grid-template-columns:1fr 1fr;max-width:400px">
        <div class="stat-card stat-success"><div class="stat-label">Workers Available</div><div class="stat-value" id="stat-available">&mdash;</div></div>
        <div class="stat-card stat-warning"><div class="stat-label">Workers Busy</div><div class="stat-value" id="stat-busy">&mdash;</div></div>
      </div>
      <div class="card">
        <div class="card-header"><h2 class="card-title">Recent Complaints</h2><a href="complaints.html" class="btn btn-sm btn-ghost">View All</a></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Complaint No.</th><th>Title</th><th>Status</th><th>Priority</th><th>Date</th></tr></thead>
            <tbody id="recent-tbody"><tr><td colspan="5"><div class="page-loader"><span class="spinner"></span></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/sidebar-area.js"></script>
<script>
  Auth.require("area_admin", "admin", "super_admin");
  renderSidebar("dashboard");
  initSidebar();
  Theme.apply();
  loadNotifBadge();
  document.getElementById("topbar-date").textContent = new Date().toLocaleDateString("en-IN", { weekday:"long", day:"2-digit", month:"long", year:"numeric" });
  async function loadDashboard() {
    try {
      const d = await API.areaAdmin.dashboard();
      document.getElementById("ward-name").textContent = d.ward ? `${d.ward.ward_name} (${d.ward.zone_name || ""})` : "";
      document.getElementById("stat-total").textContent = d.complaints.total;
      document.getElementById("stat-pending").textContent = d.complaints.pending;
      document.getElementById("stat-inprogress").textContent = d.complaints.in_progress;
      document.getElementById("stat-completed").textContent = d.complaints.completed;
      document.getElementById("stat-available").textContent = d.workers.available;
      document.getElementById("stat-busy").textContent = d.workers.busy;
      const tbody = document.getElementById("recent-tbody");
      if (!d.recent.length) { tbody.innerHTML = emptyRow(5, "No complaints yet."); return; }
      tbody.innerHTML = d.recent.map(c => `<tr style="cursor:pointer" onclick="location.href='complaint-detail.html?id=${c.id}'">
        <td><span style="font-family:monospace;font-weight:600">${c.complaint_no || "—"}</span></td>
        <td>${c.title}</td>
        <td>${statusBadge(c.status)}</td>
        <td>${priorityBadge(c.priority)}</td>
        <td style="color:var(--text-muted)">${formatDate(c.created_at)}</td>
      </tr>`).join("");
    } catch (err) { toast(err.message, "error"); }
  }
  loadDashboard();
</script>
</body>
</html>
